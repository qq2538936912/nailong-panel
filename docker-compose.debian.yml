name: panel

services:
  panel:
    # 没有 build 时 `docker compose up --build` 是空操作，容器会继续跑仓库里的现成镜像。
    # 改过前端/后端源码后必须在这台机器上用当前目录重新编一次，才会看到终端页等本地改动。
    build:
      context: .
      dockerfile: Dockerfile.debian
      args:
        VERSION: ${PANEL_VERSION:-1.0.1}
    image: ${PANEL_IMAGE:-xiaofeilong2/panel:debian}
    container_name: panel
    restart: unless-stopped
    ports:
      - "15700:5700" # 宿主机端口:容器内 Nginx 端口
    volumes:
      - ./Panel:/app/Panel
    environment:
      - TZ=Asia/Shanghai
      - CONTAINER_NAME=panel
      # 镜像地址与上面的 image 共用一个变量，切换标签时只需要改一处。
      - IMAGE_NAME=${PANEL_IMAGE:-xiaofeilong2/panel:debian}
      - PANEL_UPDATE_MANAGER=watchtower
      # 面板通过容器网络触发 Watchtower，API 不向宿主机开放端口。
      - WATCHTOWER_HTTP_API_URL=${WATCHTOWER_HTTP_API_URL:-http://watchtower:8080}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-panel-watchtower-token}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      # === 飞牛 OS / 群晖 / 绿联等 NAS 可选环境变量 ===========================
      # 让容器以宿主机用户身份运行，使 SMB/NFS 共享的目录权限一致。
      # 不设则默认 root（与历史行为兼容）。运行 `id` 查看你的 UID/GID。
      # 两个都要设：只设 PGID 时 PUID 会取到 0，等于没降权。
      # Debian 版镜像基于 node:20-bookworm-slim，自带一个 uid/gid 都是 1000 的 node
      # 用户；PUID=1000 撞上它不要紧，容器会直接复用那个账号。
      # 注意：降权后面板里的「Linux 系统依赖」(apt) 装不了，它需要 root；
      # Node.js / Python 依赖不受影响。
      # - PUID=1000
      # - PGID=1000
      #
      # 公网域名/反代域名访问面板时需要把 origin 加入 CORS 白名单。
      # 私有/局域网 IP 已自动放行，无需配置。多个用逗号分隔。
      # - CORS_ORIGINS=https://panel.your-domain.com,https://nas.your-domain.com
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: panel-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      # 开放 update endpoint，并与面板共用令牌；服务地址只需要配置在面板容器。
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-panel-watchtower-token}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_ENDPOINTS=update
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "3600"
